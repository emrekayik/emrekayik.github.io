---
layout: default
title: "Yazılarım"
permalink: /blog/
---

<article class="prose w-full mx-auto">
    <h2 class="flex justify-between items-center">Yazılarım<i class="ai-book-close text-2xl"></i></h2>
    <ul class="font-mono space-y-2">
        {% for post in site.posts %}
        <li class="flex flex justify-between space-x-2 items-center border-b border-base-300 pb-1">
            <a class="link hover:text-primary transition-colors" href="{{ post.url }}">{{ post.title }}</a>
            <time class="text-xs text-base-content/60 text-nowrap">{{ post.date | localize: '%-d %B %Y' }}</time>
        </li>
        {% endfor %}
    </ul>
</article>

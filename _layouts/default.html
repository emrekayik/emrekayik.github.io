<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}" data-theme="mytheme" class="overflow-x-clip max-w-full w-full">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta charset="utf-8" />

    <!-- Icon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/icons/favicon-16x16.png"
    />

    <link rel="manifest" href="{{ '/manifest.json' | relative_url }}" />
    <link
      rel="mcp"
      href="{{ '/mcp-data.json' | relative_url }}"
      type="application/json"
      title="Model Context Protocol Data"
    />
    <meta name="theme-color" content="#4ade80" />

    {% seo %}

    <!-- Analytics -->
    <meta
      name="google-site-verification"
      content="9XpwUtKuwRYynL-F49caBUhSrEPeSOncQKYHCAkx-9E"
    />
    <meta name="yandex-verification" content="aa9c0ff5a8dc05c3" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Antic+Slab&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var t = localStorage.getItem("selected-theme") || "system";
          if (t === "system") {
            var m =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)");
            t = m && m.matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <style>
      [x-cloak] {
        display: none;
      }
      html, body {
        overflow-x: clip;
        max-width: 100%;
        width: 100%;
      }
    </style>
    <link rel="stylesheet" href="{{ '/assets/css/app.css' | relative_url }}" />

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <script defer src="https://unpkg.com/akar-icons-fonts"></script>
  </head>

  <body
    class="bg-base-100 text-base-content overflow-x-clip max-w-full w-full relative"
    id="context-area"
  >
    <div class="drawer drawer-end max-w-full overflow-x-clip w-full">
      <input id="my-drawer" type="checkbox" class="drawer-toggle" aria-label="Menü çekmecesi" />
      <div class="drawer-content flex flex-col min-h-screen max-w-full overflow-x-clip w-full">
        {% include navbar.html %}
        <main
          id="content"
          class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 md:py-12 bg-base-100 overflow-x-clip"
        >
          <div class="p-0 md:p-8 lg:p-12">{{ content }}</div>
        </main>
        {% include footer.html %}
      </div>

      <div class="drawer-side z-[100] overflow-hidden overscroll-contain">
        <label
          for="my-drawer"
          aria-label="Menüyü kapat"
          class="drawer-overlay"
        ></label>
        {% include sidebar.html %}
      </div>
    </div>

    <!-- Cloudflare Web Analytics -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "bb82c0547b284f8ca5092e8ff196175c"}'
    ></script>
    <!-- End Cloudflare Web Analytics -->

    <script type="module" src="https://ascii.rest/ascii.js"></script>
    <script
      defer
      src="https://unpkg.com/tailwindcss-intersect@2.x.x/dist/observer.min.js"
    ></script>
    <script defer src="{{ '/assets/js/main.js' | relative_url }}"></script>

    <!-- Web MCP (Model Context Protocol) Implementation -->
    <script>
      (function () {
        let cachedData = null;
        async function getMcpData() {
          if (!cachedData) {
            try {
              const res = await fetch("{{ '/mcp-data.json' | relative_url }}");
              cachedData = await res.json();
            } catch (err) {
              console.error("MCP data fetch error:", err);
              throw new Error("Site verileri yüklenemedi: " + err.message);
            }
          }
          return cachedData;
        }

        const webMcpTools = {
          listTools: () => [
            {
              name: "search_site",
              description:
                "Emre Kayık'ın sitesindeki blog yazıları, açık kaynak projeler, notlar ve sayfalar arasında anahtar kelime araması yapar.",
              inputSchema: {
                type: "object",
                properties: {
                  query: {
                    type: "string",
                    description:
                      "Aranacak terim, konu veya teknoloji (örn. 'rust', 'transformers', 'next.js', 'animasyon')",
                  },
                  category: {
                    type: "string",
                    description: "Arama yapılacak kategori (isteğe bağlı)",
                    enum: ["all", "posts", "projects", "notes", "pages"],
                  },
                },
                required: ["query"],
              },
            },
            {
              name: "search_site_posts",
              description:
                "Sitedeki blog yazıları arasında anahtar kelime araması yapar.",
              inputSchema: {
                type: "object",
                properties: {
                  query: {
                    type: "string",
                    description: "Aranacak kelime veya konu",
                  },
                },
                required: ["query"],
              },
            },
            {
              name: "get_projects",
              description:
                "Emre Kayık'ın geliştirdiği tüm açık kaynak projeleri, GitHub depoları ve açıklamalarıyla listeler.",
              inputSchema: {
                type: "object",
                properties: {
                  tag: {
                    type: "string",
                    description:
                      "Filtrelenecek etiket/teknoloji (isteğe bağlı, örn: 'python', 'rust', 'web')",
                  },
                },
              },
            },
            {
              name: "get_author_info",
              description:
                "Site sahibi Emre Kayık hakkında biyografi, iletişim, yetenekler ve sosyal medya bağlantılarını getirir.",
              inputSchema: {
                type: "object",
                properties: {},
              },
            },
            {
              name: "navigate_to_page",
              description:
                "Kullanıcıyı sitedeki belirli bir sayfaya veya içeriğe yönlendirir.",
              inputSchema: {
                type: "object",
                properties: {
                  url: {
                    type: "string",
                    description:
                      "Gidilecek sayfa adresi veya yol (örn: '/blog', '/projeler', '/ozgecmis', '/me')",
                  },
                },
                required: ["url"],
              },
            },
            {
              name: "switch_theme",
              description:
                "Web sitesinin görsel temasını dinamik olarak değiştirir.",
              inputSchema: {
                type: "object",
                properties: {
                  theme: {
                    type: "string",
                    description: "Uygulanacak tema adı",
                    enum: [
                      "system",
                      "mytheme",
                      "dark",
                      "light",
                      "cupcake",
                      "bumblebee",
                      "emerald",
                      "corporate",
                      "synthwave",
                      "retro",
                      "cyberpunk",
                      "valentine",
                      "halloween",
                      "garden",
                      "forest",
                      "aqua",
                      "lofi",
                      "pastel",
                    ],
                  },
                },
                required: ["theme"],
              },
            },
          ],

          callTool: async (name, args = {}) => {
            const data = await getMcpData();

            if (name === "search_site" || name === "search_site_posts") {
              const q = (args.query || "").toLowerCase();
              const cat = args.category || (name === "search_site_posts" ? "posts" : "all");
              const results = [];

              function searchItems(items, type) {
                if (!items) return;
                items.forEach((item) => {
                  const title = (item.title || "").toLowerCase();
                  const desc = (item.description || item.content || "").toLowerCase();
                  const tags = (item.tags || []).join(" ").toLowerCase();
                  const repo = (item.repo || "").toLowerCase();

                  if (
                    title.includes(q) ||
                    desc.includes(q) ||
                    tags.includes(q) ||
                    repo.includes(q)
                  ) {
                    results.push({
                      type,
                      title: item.title,
                      url: item.url,
                      description: item.description,
                      repo: item.repo,
                      date: item.date,
                    });
                  }
                });
              }

              if (cat === "all" || cat === "posts") searchItems(data.posts, "post");
              if (cat === "all" || cat === "projects") searchItems(data.projects, "project");
              if (cat === "all" || cat === "notes") searchItems(data.notes, "note");
              if (cat === "all" || cat === "pages") searchItems(data.pages, "page");

              return {
                content: [
                  {
                    type: "text",
                    text:
                      results.length > 0
                        ? JSON.stringify(results.slice(0, 8), null, 2)
                        : `"${args.query}" için eşleşen sonuç bulunamadı.`,
                  },
                ],
              };
            }

            if (name === "get_projects") {
              let projects = data.projects || [];
              if (args.tag) {
                const t = args.tag.toLowerCase();
                projects = projects.filter((p) =>
                  (p.tags || []).some((tag) => tag.toLowerCase().includes(t))
                );
              }
              return {
                content: [{ type: "text", text: JSON.stringify(projects, null, 2) }],
              };
            }

            if (name === "get_author_info") {
              return {
                content: [
                  {
                    type: "text",
                    text: JSON.stringify(
                      {
                        author: data.author,
                        site: data.site,
                        cv_url: "{{ '/ozgecmis/' | absolute_url }}",
                        about_url: "{{ '/me/' | absolute_url }}",
                      },
                      null,
                      2
                    ),
                  },
                ],
              };
            }

            if (name === "navigate_to_page") {
              if (args.url) {
                window.location.href = args.url;
                return {
                  content: [
                    { type: "text", text: `${args.url} adresine yönlendiriliyor.` },
                  ],
                };
              }
              throw new Error("Gidilecek URL belirtilmedi.");
            }

            if (name === "switch_theme") {
              const theme = args.theme;
              if (theme) {
                localStorage.setItem("selected-theme", theme);
                if (theme === "system") {
                  const m = window.matchMedia("(prefers-color-scheme: dark)");
                  document.documentElement.setAttribute(
                    "data-theme",
                    m.matches ? "dark" : "light"
                  );
                } else {
                  document.documentElement.setAttribute("data-theme", theme);
                }
                const radios = document.querySelectorAll(".theme-controller");
                radios.forEach((r) => {
                  r.checked = r.value === theme;
                });
                return {
                  content: [
                    {
                      type: "text",
                      text: `Site teması başarıyla '${theme}' olarak değiştirildi.`,
                    },
                  ],
                };
              }
              throw new Error("Tema adı belirtilmedi.");
            }

            throw new Error(`Bilinmeyen araç: ${name}`);
          },
        };

        // Global erişim
        window.webMcp = webMcpTools;
        window.__mcp = webMcpTools;

        // Tarayıcı yerel WebMCP API'si
        if (
          "modelContext" in navigator &&
          typeof navigator.modelContext.provideContext === "function"
        ) {
          try {
            navigator.modelContext.provideContext({
              tools: webMcpTools.listTools(),
              execute: webMcpTools.callTool,
            });
          } catch (e) {
            console.warn("Navigator modelContext error:", e);
          }
        }

        // JSON-RPC 2.0 postMessage köprüsü
        window.addEventListener("message", async (event) => {
          if (!event.data || typeof event.data !== "object") return;
          if (event.data.jsonrpc !== "2.0") return;
          if (!event.data.method) return; // Yanıt mesajlarını döngüye sokma

          const { id, method, params } = event.data;
          const target = event.source || window;

          try {
            if (method === "initialize") {
              target.postMessage(
                {
                  jsonrpc: "2.0",
                  id,
                  result: {
                    protocolVersion: "2024-11-05",
                    capabilities: { tools: {} },
                    serverInfo: { name: "emrekayik-web-mcp", version: "1.0.0" },
                  },
                },
                "*"
              );
            } else if (method === "ping") {
              target.postMessage({ jsonrpc: "2.0", id, result: {} }, "*");
            } else if (method === "tools/list") {
              target.postMessage(
                {
                  jsonrpc: "2.0",
                  id,
                  result: { tools: webMcpTools.listTools() },
                },
                "*"
              );
            } else if (method === "tools/call") {
              const result = await webMcpTools.callTool(
                params.name,
                params.arguments || params.parameters
              );
              target.postMessage({ jsonrpc: "2.0", id, result }, "*");
            } else {
              target.postMessage(
                {
                  jsonrpc: "2.0",
                  id,
                  error: { code: -32601, message: `Bilinmeyen metot: ${method}` },
                },
                "*"
              );
            }
          } catch (err) {
            target.postMessage(
              {
                jsonrpc: "2.0",
                id,
                error: { code: -32603, message: err.message || "İç hata oluştu" },
              },
              "*"
            );
          }
        });
      })();
    </script>
  </body>
</html>

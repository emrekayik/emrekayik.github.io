      <a href="https://jekyllrb.com" target="_blank" class="link">Jekyll</a> ve
      <a href="https://tailwindcss.com" target="_blank" class="link"

      >
      kullanılarak Emre Kayık tarafından oluşturulmuştur.
    </p>
    <p class="mt-2">

      >
    </p>
  </aside>

  <div class="w-full sm:w-auto flex justify-center items-center overflow-hidden">

      ></ascii-art>
    </div>
  </div>
</footer>

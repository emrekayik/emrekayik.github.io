- category: Donanım
  items:
    - name: Apple MacBook Air M4
      description: Günlük işlerim ve kodlama için kullandığım ana bilgisayarım.  Aşırı derecede memnunum, tüm işlerimi fazlasıyla karşılıyor. İlk Apple cihazım ayrıca.
      link: https://www.apple.com/tr/macbook-air/
      icon: "ph ph-laptop"

    - name: HP 255 G8
      description: Günlük işlerim ve kodlama için kullandığım ana bilgisayarım. Günlük işlerimde yetersizliğini hissettirse de yükümüz taşıyor.
      link: https://support.hp.com/us-en/drivers/hp-255-g8-notebook-pc/38151405
      icon: "ph ph-laptop"

    - name: Huawei Matepad 11.5
      description: Alırken tereddüt ettiğim fakat aldıktan sonra bayıldığım ürün. Klavye kombinasyonuyla harika oluyor, yazılım işlerimin bir kısmını bile bu tabletle halledebiliyorum.
      link: https://consumer.huawei.com/tr/tablets/matepad-11-5/
      icon: "ph ph-device-tablet"

    - name: Xiaomi Redmi Note 12
      description: Günlük işlerim ve sosyal medya için kullandığım telefonum.
      link: https://www.mi.com/tr/redmi-note-12/
      icon: "ph ph-device-mobile"

- category: Yazılım Geliştirme Araçlarım
  items:
    - name: Visual Studio Code
      description: Neredeyse tüm kodlama işlerim için kullandığım metin editörü. Eklenti desteği sayesinde çok güçlü.
      link: https://code.visualstudio.com/
      icon: "ph ph-code"
      open_source: true

    - name: XCode
      description: Swift ile uygulama geliştirmek için kullandığım IDE.
      link: https://developer.apple.com/xcode/
      icon: "ph ph-code"

    - name: WebStorm
      description: Web geliştirme için kullandığım JetBrains'in IDE'si. Bu web adresimi de bu araçla geliştirdim.
      link: https://www.jetbrains.com/webstorm/
      icon: "ph ph-code"

    - name: Code::Blocks
      description: C ve C++ programlama dilleri için kullandığım IDE. Özellikle düşük seviyeli programlama projelerimde tercih ediyorum.
      link: https://www.codeblocks.org/
      icon: "ph ph-code"
      open_source: true

    - name: Android Studio
      description: Android uygulama geliştirme için kullandığım resmi IDE. Flutter ve React Native ile geliştirdiğim mobil uygulama projelerimde kullanıyorum.
      link: https://developer.android.com/studio
      icon: "ph ph-code"

    - name: helix editor
      description: Terminalden kolayca kod düzenlemesi yaptığım vim alternatifi, başarılı editör.
      link: https://helix-editor.com/
      icon: "ph ph-code"
      open_source: true

    - name: Zed editor
      description: Oldukça hızlı ve kullanışlı bir editör.
      link: https://zed.dev/
      icon: "ph ph-code"
      open_source: true

    - name: Antigravity
      description: Google tarafından geliştirilen yapay zeka destekli kod editörü.
      link: https://antigravity.ai/
      icon: "ph ph-code"

    - name: DBeaver
      description: Veritabanı yönetimi ve sorgulama için kullandığım çoklu veritabanı aracı. SQL veritabanlarıyla çalışırken vazgeçilmezim.
      link: https://dbeaver.io/
      icon: "ph ph-database"
      open_source: true

    - name: Docker Desktop
      description: Konteyner teknolojisi falan filan web adresinden bakabilirsiniz.
      link: https://www.docker.com/
      icon: "ph ph-shipping-container"
      open_source: true

    - name: Godot Engine
      description: Kendi kendime oyun denemeleri yaptığım basit ve kullanışlı oyun motoru.
      link: https://godotengine.org/
      icon: "ph ph-game-controller"
      open_source: true

- category: Tasarım Araçlarım
  items:
    - name: Figma
      description: Web tasarımı ve prototipleme için vazgeçilmezim. Buradan yaptığım tasarımlarımı koda dökmeye bayılıyorum.
      link: https://www.figma.com/
      icon: "ph ph-pen-nib"

    - name: Inkscape
      description: Vektör tabanlı grafik tasarım için kullandığım açık kaynaklı yazılım.
      link: https://inkscape.org/
      icon: "ph ph-pen-nib"
      open_source: true

    - name: Siril
      description: Astrofotoğrafları işlemek için kullandığım yazılım.
      link: https://siril.org/
      icon: "ph ph-image"

    - name: GIMP
      description: Fotoğraf düzenleme ve grafik tasarım için kullandığım açık kaynaklı yazılım. Photoshop'a alternatif olarak kullanıyorum.
      link: https://www.gimp.org/
      icon: "ph ph-file-image"
      open_source: true

    - name: Blender
      description: 3D tasarım denemelerimi yaptığım program.
      link: https://www.blender.org/download/
      icon: "ph ph-cube"
      open_source: true

    - name: Spline
      description: Blender benzeri daha kolay bir arayüze sahip araç. Keyifli işler ortaya çıkarmak aşırı kolay.
      link: https://spline.design
      icon: "ph ph-cube"

    - name: MagicaVoxel
      description: Piksel tabanlı 3D modelleme için kullandığım araç. Özellikle retro tarzı projelerimde kullanıyorum.
      link: https://ephtracy.github.io/
      icon: "ph ph-cube"
      open_source: true

    - name: Shapr3D
      description: 3D tasarım denemelerimi yaptığım program.
      link: https://www.shapr3d.com/
      icon: "ph ph-cube"

- category: İstatistik Araçlarım
  items:
    - name: R Studio
      description: İstatistiksel analiz ve veri görselleştirme için kullandığım araç.
      link: https://www.rstudio.com/
      icon: "ph ph-chart-bar"
      open_source: true

    - name: Julia
      description: Yüksek performanslı bilimsel hesaplama için kullandığım programlama dili.
      link: https://julialang.org/
      icon: "ph ph-chart-bar"
      open_source: true

    - name: Python
      description: Veri analizi ve makine öğrenmesi için kullandığım programlama dili.
      link: https://www.python.org/
      icon: "ph ph-chart-bar"
      open_source: true

    - name: Jamovi
      description: İstatistiksel analiz için kullandığım açık kaynaklı yazılım.
      link: https://www.jamovi.org/
      icon: "ph ph-chart-bar"

    - name: SPSS
      description: İstatistiksel analiz için kullandığım yazılım.
      link: https://www.ibm.com/products/spss-statistics
      icon: "ph ph-chart-bar"

- category: Üretkenlik Araçlarım
  items:
    - name: Obsidian
      description: Kişisel notlarımı, fikirlerimi ve "dijital bahçemi" tuttuğum yer.
      link: https://obsidian.md/
      icon: "ph ph-note-pencil"

    - name: Notion
      description: Projelerimi, görevlerimi ve günlük işlerimi takip ettiğim yer. Aynı zamanda blog yazılarımın taslaklarını da burada tutuyorum.
      link: https://www.notion.so/
      icon: "ph ph-notepad"

    - name: Clockify
      description: Zaman takibi ve görev yönetimi için kullandığım basit ama etkili araç. Günlük işlerimi düzenli tutmamda yardımcı oluyor.
      link: https://clockify.me/
      icon: "ph ph-clock"

    - name: Raycast
      description: İki tuş kombinasyonu ile Spotlight'tan daha fazlasını sunan harika bir araç.
      link: https://www.raycast.com/
      icon: "ph ph-command"

    - name: Raindrop.io
      description: Bookmark yönetimi için kullandığım araç.
      link: https://raindrop.io/
      icon: "ph ph-bookmark"

    - name: Zen Browser
      description: Tarayıcı olarak kullandığım, vazgeçilmezim. Özelleştirilebilirliği ve eklenti desteği sayesinde çok güçlü.
      link: https://zenbrowser.app/
      icon: "ph ph-browser"
      open_source: true

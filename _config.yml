# ==============================================================================
# Site Settings & Metadata
# ==============================================================================
url: "https://emrekayik.github.io"
baseurl: ""
lang: "tr-TR"
date_locale: tr

title: "/home/emre"
description: "projelerim, yazılarım ve daha fazlası."

author:
  name: Emre Kayık
  email: emrekayik1905@gmail.com
  twitter: emrekayik0

# ==============================================================================
# SEO Settings
# ==============================================================================
twitter:
  username: emrekayik0
  card: summary_large_image

# ==============================================================================
# Social Media Links
# ==============================================================================
social:
  name: Emre Kayık
  links:
    - https://github.com/emrekayik
    - https://www.linkedin.com/in/emrekayik
    - https://twitter.com/emrekayik0
    - https://instagram.com/emrekayik0

# ==============================================================================
# Content Collections
# ==============================================================================
collections:
  projects:
    output: true
    permalink: /projeler/:title/
  posts:
    output: true
    permalink: /blog/:title/
  suggestions:
    output: false
    permalink: /suggestions/:title/
  notes:
    output: true
    permalink: /notlar/:title/

# ==============================================================================
# Front Matter Defaults
# ==============================================================================
defaults:
  - scope:
      path: ""
      type: "projeler"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Emre Kayık"
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "note"
      author: "Emre Kayık"
  - scope:
      path: ""
    values:
      layout: "default"

# ==============================================================================
# Build & Processing Settings
# ==============================================================================
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

highlighter: rouge

reading_time:
  words_per_minute: 250
  minutes_per_image: 0.2

# ==============================================================================
# Plugins
# ==============================================================================
plugins:
  - jekyll-feed
  - jekyll-admin
  - jekyll-tailwind
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-spaceship
  - jekyll-og-image

# ==============================================================================
# Plugin Configurations
# ==============================================================================
# Disqus
disqus:
  shortname: emrekayik

# Jekyll Admin
jekyll_admin:
  homepage: "posts"
  layout: "admin"
  title: "Admin Panel"
  url: "http://localhost:4000/admin"

# Tailwind CSS & PostCSS
tailwind:
  input: assets/css/tailwind.css
  output: assets/css/app.css

postcss:
  cache: false

# jekyll-og-image
og_image:
  collections:
    - posts
    - projects
    - notes
    - pages
  output_dir: "assets/images/og"
  force: false
  verbose: false
  skip_drafts: true
  domain: "emrekayik.github.io"
  canvas:
    background_color: "#0f172a"
    width: 1200
    height: 600
  header:
    prefix: ""
    suffix: ""
    font_family: "Inter, Bold"
    color: "#f8fafc"
  content:
    font_family: "Inter, Regular"
    color: "#94a3b8"
  border_bottom:
    width: 12
    fill:
      - "#3b82f6"
      - "#8b5cf6"
      - "#ec4899"
  image:
    path: "/assets/icons/apple-touch-icon.png"
  metadata:
    fields:
      - date
      - author
    separator: " • "
    date_format: "%d.%m.%Y"

# Jekyll Spaceship
jekyll-spaceship:
  processors:
    - table-processor
    - mathjax-processor
    - plantuml-processor
    - mermaid-processor
    - polyfill-processor
    - media-processor
    - emoji-processor
    - element-processor
  mathjax-processor:
    src:
      - https://polyfill.io/v3/polyfill.min.js?features=es6
      - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    config:
      tex:
        inlineMath:
          - ["$", "$"]
          - ['\(', '\)']
        displayMath:
          - ["$$", "$$"]
          - ['\[', '\]']
      svg:
        fontCache: "global"
    optimize:
      enabled: true
      include: []
      exclude: []
  plantuml-processor:
    mode: default
    css:
      class: plantuml
    syntax:
      code: "plantuml!"
      custom: ["@startuml", "@enduml"]
    src: http://www.plantuml.com/plantuml/svg/
  mermaid-processor:
    mode: default
    css:
      class: mermaid
    syntax:
      code: "mermaid!"
      custom: ["@startmermaid", "@endmermaid"]
    config:
      theme: default
    src: https://mermaid.ink/svg/
  media-processor:
    default:
      id: "media-{id}"
      class: "media"
      width: "100%"
      height: 350
      frameborder: 0
      style: "max-width: 600px; outline: none;"
      allow: "encrypted-media; picture-in-picture"
  emoji-processor:
    css:
      class: emoji
    src: https://github.githubassets.com/images/icons/emoji/

# ==============================================================================
# Exclude Files & Directories
# ==============================================================================
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - .gitignore
  - .github
  - .jekyll-cache
  - .jekyll-metadata
  - .sass-cache
  - .vscode
  - .DS_Store
  - .idea
  - .env
  - package.json
  - package-lock.json
  - tailwind.config.js
  - assets/css/tailwind.css
